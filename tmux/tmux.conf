unbind C-b
set -g prefix C-a
bind C-a send-prefix


# prefix+e: new pane (side-by-side) in the current pane's directory
bind e split-window -h -c "#{pane_current_path}"
# prefix+E: same, but launch nvim there (pane closes when nvim exits)
bind E split-window -h -c "#{pane_current_path}" "nvim ."
# prefix+a: same, but launch Claude Code there (pane closes when claude exits)
bind a split-window -h -c "#{pane_current_path}" "claude"

# --- Neovim-friendly settings ---
set -sg escape-time 10          # no lag after <Esc> in nvim
set -g focus-events on          # lets nvim reload files changed outside it
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # true colour
set -g mouse on
set -g history-limit 50000

# --- vim-tmux-navigator: Ctrl-h/j/k/l across nvim splits and tmux panes ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l          # prefix+Ctrl-l still clears the screen

# --- F12: hand every key to a nested tmux (e.g. ~/Learn/nvim-course/workenv) ---
# Press F12 in the pane running the inner tmux: this tmux stops listening (no
# prefix, no Ctrl-h/j/k/l) and the status bar says so. F12 again turns it back on.
bind -T root F12 set prefix None \; set key-table off \; set status-style "fg=colour16,bg=colour214" \; set status-right " KEYS GO TO INNER TMUX - F12 to return " \; refresh-client -S
bind -T off F12 set -u prefix \; set -u key-table \; set -u status-style \; set -u status-right \; refresh-client -S
